<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Gestión de Licencias</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-container { max-width: 1000px; margin: 40px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .table-custom th { background-color: #343a40; color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-container">
            <!-- Cabecera -->
            <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                <div>
                    <h2><i class="fas fa-user-shield text-primary me-2"></i>Panel de Administración</h2>
                    <p class="text-muted small mb-0">Gestiona las solicitudes de licencias y asigna códigos de acceso</p>
                </div>
                <button onclick="cargarSolicitudes()" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-sync-alt me-1"></i> Actualizar Lista
                </button>
            </div>

            <!-- Tabla de Solicitudes -->
            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Correo Electrónico</th>
                            <th>Aplicativo</th>
                            <th>Estado Actual</th>
                            <th>Código de Activación</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-4">Cargando solicitudes desde Turso...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // URL directa de tu base de datos en Turso
        const urlHttp = "https://aplicativos-acreditacionesmmg.aws-us-east-1.turso.io/v2/pipeline";
        const tursoToken = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODYzOTA3ODQsImlkIjoiMDE5ZmVkMmItOGUwMS03NTBmLWE1OTctMzA5Mzk3NThhZDNiIiwia2lkIjoibGlxd0NQQ1RjVzZLMTJEUWNJMVhVejRCeGZUMWFnT3FDbHZ2Y3RnZ1BqQSIsInJpZCI6IjFjOTgzZGExLWI4MGUtNGE3OS05MjIxLTNhMDc1M2UyYzU0YiJ9.3KWHzJajGz62k_P-mvvBj25I1kwY8ZTJvSUCXUO61sILuwvZTpJoxzdLWr39nZI3DofY2PV_lVGW5BS4QunfAQ";

        async function cargarSolicitudes() {
            const tbody = document.getElementById('tablaSolicitudes');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">Cargando...</td></tr>';

            const bodyData = {
                requests: [
                    { type: "execute", stmt: { sql: "SELECT * FROM licencias ORDER BY id DESC;" } },
                    { type: "close" }
                ]
            };

            try {
                const response = await fetch(urlHttp, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${tursoToken}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify(bodyData)
                });

                const data = await response.json();
                const rows = data.results[0].response.result.rows;

                if (!rows || rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No hay solicitudes.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                rows.forEach(row => {
                    const id = row[0].value;
                    const email = row[1].value;
                    const aplicativo = row[2].value;
                    const codigo = row[3] && row[3].value !== null ? row[3].value : '';
                    const estado = row[4].value;

                    let badgeColor = estado === 'activo' ? 'bg-success' : 'bg-warning text-dark';

                    tbody.innerHTML += `
                        <tr>
                            <td>#${id}</td>
                            <td class="fw-semibold">${email}</td>
                            <td>${aplicativo}</td>
                            <td><span class="badge ${badgeColor}">${estado}</span></td>
                            <td>
                                <input type="text" id="codigo-${id}" class="form-control form-control-sm" value="${codigo}" placeholder="Código...">
                            </td>
                            <td class="text-center">
                                <button onclick="aprobarLicencia(${id})" class="btn btn-success btn-sm px-3">
                                    <i class="fas fa-check me-1"></i> Guardar
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-danger py-4">Error de conexión. Verifica la consola.</td></tr>';
            }
        }

        async function aprobarLicencia(id) {
            const nuevoCodigo = document.getElementById(`codigo-${id}`).value.trim();
            if (!nuevoCodigo) return alert("Escribe un código.");

            const bodyData = {
                requests: [
                    {
                        type: "execute",
                        stmt: {
                            sql: "UPDATE licencias SET codigo_activacion = ?, estado = 'activo' WHERE id = ?;",
                            args: [{ type: "text", value: nuevoCodigo }, { type: "integer", value: id }]
                        }
                    },
                    { type: "close" }
                ]
            };

            const response = await fetch(urlHttp, {
                method: "POST",
                headers: { "Authorization": `Bearer ${tursoToken}`, "Content-Type": "application/json" },
                body: JSON.stringify(bodyData)
            });

            if (response.ok) {
                alert("¡Actualizado!");
                cargarSolicitudes();
            }
        }

        window.onload = cargarSolicitudes;
    </script>
</body>
</html>
