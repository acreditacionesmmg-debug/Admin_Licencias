<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Gestión de Licencias</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --bg-color: #f8f9fa;
        }
        body { 
            background-color: var(--bg-color); 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            color: #333;
        }
        .admin-container { 
            max-width: 1300px; 
            margin: 20px auto; 
            background: white; 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
        }
        @media (min-width: 768px) { 
            .admin-container { padding: 35px; margin: 40px auto; } 
        }
        .header-title {
            font-weight: 700;
            color: #1e293b;
        }
        .search-box {
            position: relative;
        }
        .search-box .fa-search {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }
        .search-input {
            padding-left: 42px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
            transition: all 0.3s;
        }
        .search-input:focus {
            background-color: #fff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(67, 97, 238, 0.1);
        }
        .table-custom th {
            background-color: #1e293b;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 12px 16px;
        }
        .table-custom td {
            padding: 14px 16px;
            vertical-align: middle;
        }
        .badge-pending {
            background-color: #f59e0b;
            color: white;
        }
        .badge-active {
            background-color: #10b981;
            color: white;
        }
        .badge-disabled {
            background-color: #dc3545;
            color: white;
        }
        .app-badge {
            background-color: #e0e7ff;
            color: #3730a3;
            font-weight: 500;
            font-size: 0.75rem;
        }
        .btn-action {
            border-radius: 8px;
            font-weight: 500;
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        body:not(.sesion-activa) .panel-principal {
            display: none;
        }
        .acceso-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at 20% 15%, rgba(13, 110, 253, 0.12), transparent 34%),
                radial-gradient(circle at 85% 85%, rgba(67, 97, 238, 0.10), transparent 32%),
                #f4f7fb;
        }
        body.sesion-activa .acceso-overlay {
            display: none;
        }
        .acceso-card {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            border: 1px solid rgba(226, 232, 240, 0.9);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.13);
        }
        .acceso-icono {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            margin: 0 auto 20px;
            border: 1px solid #dbe8ff;
            border-radius: 18px;
            background: linear-gradient(145deg, #edf4ff, #dfeaff);
            color: #0d6efd;
            font-size: 1.8rem;
            box-shadow: 0 10px 24px rgba(13, 110, 253, 0.12);
        }
        .acceso-card .form-label {
            margin-bottom: 7px;
            color: #334155;
            font-size: 0.9rem;
        }
        .acceso-card .form-control {
            min-height: 48px;
            border-color: #d7dee8;
            border-radius: 10px;
            color: #172033;
            box-shadow: none;
        }
        .acceso-card .form-control:focus {
            border-color: #6ea8fe;
            box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.12);
        }
        .campo-clave {
            position: relative;
        }
        .campo-clave .form-control {
            padding-right: 50px;
        }
        .btn-ver-clave {
            position: absolute;
            top: 50%;
            right: 6px;
            z-index: 5;
            width: 38px;
            height: 38px;
            padding: 0;
            transform: translateY(-50%);
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #64748b;
        }
        .btn-ver-clave:hover,
        .btn-ver-clave:focus-visible {
            background: #eef4ff;
            color: #0d6efd;
        }
        .btn-ingresar {
            min-height: 48px;
            border: 0;
            border-radius: 10px;
            background: linear-gradient(135deg, #0d6efd, #315bea);
            box-shadow: 0 10px 20px rgba(13, 110, 253, 0.2);
        }
        .btn-ingresar:hover {
            background: linear-gradient(135deg, #0b5ed7, #284bc9);
            transform: translateY(-1px);
        }
        @media (max-width: 480px) {
            .acceso-card {
                padding: 30px 24px;
                border-radius: 18px;
            }
        }

        /* DISEÑO RESPONSIVE: Conversión a Tarjetas en dispositivos móviles */
        @media (max-width: 767px) {
            .table-custom thead { display: none; }
            .table-custom, .table-custom tbody, .table-custom tr, .table-custom td { display: block; width: 100%; }
            .table-custom tr { 
                margin-bottom: 20px; 
                border: 1px solid #e2e8f0; 
                border-radius: 12px; 
                padding: 15px; 
                background: #fff;
                box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            }
            .table-custom td { 
                text-align: right; 
                padding: 10px 0; 
                border: none; 
                border-bottom: 1px solid #f1f5f9;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            .table-custom td:last-child { border-bottom: none; }
            .table-custom td::before { 
                content: attr(data-label); 
                font-weight: 600; 
                color: #64748b; 
                font-size: 0.75rem; 
                text-transform: uppercase;
            }
            /* Adaptar elementos internos dentro de la celda en móvil */
            .table-custom td > div { width: 100%; text-align: right; }
            .table-custom .input-group { width: 100% !important; justify-content: flex-end; }
            .table-custom .d-flex.justify-content-center { justify-content: flex-end !important; }
            .btn-action { width: auto; }
        }
    </style>
</head>
<body>

    <div id="accesoOverlay" class="acceso-overlay" role="dialog" aria-modal="true" aria-labelledby="tituloAcceso">
        <div class="acceso-card">
            <div class="acceso-icono"><i class="fas fa-shield-alt"></i></div>
            <h2 id="tituloAcceso" class="h4 text-center fw-bold mb-2">Acceso administrativo</h2>
            <p class="text-muted text-center small mb-4">Identifícate para gestionar licencias y dispositivos</p>
            <form id="formularioAcceso" autocomplete="off">
                <div class="mb-3">
                    <label for="usuarioAcceso" class="form-label fw-semibold">Usuario</label>
                    <input type="text" id="usuarioAcceso" class="form-control" autocomplete="username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="claveAcceso" class="form-label fw-semibold">Contraseña</label>
                    <div class="campo-clave">
                        <input type="password" id="claveAcceso" class="form-control" autocomplete="current-password" required>
                        <button type="button" id="botonVerClave" class="btn-ver-clave" onclick="alternarVisibilidadClave()" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
                            <i class="fas fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div id="mensajeAcceso" class="alert alert-danger py-2 small d-none" role="alert"></div>
                <button type="submit" class="btn btn-primary btn-ingresar w-100 fw-semibold">
                    Ingresar <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="container-fluid px-2 px-md-4 panel-principal">
        <div class="admin-container">
            <!-- Cabecera -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
                <div>
                    <h2 class="header-title mb-1"><i class="fas fa-shield-alt text-primary me-2"></i>Panel de Administración</h2>
                    <p class="text-muted small mb-0">Gestión avanzada de licencias, estados y códigos de acceso</p>
                </div>
                <div class="d-flex align-items-center justify-content-md-end gap-2 flex-wrap">
                    <button id="botonCompartir" onclick="compartirEnlace()" class="btn btn-outline-info btn-sm" title="Compartir enlace del panel">
                        <i class="fas fa-share-alt me-1"></i> Compartir enlace
                    </button>
                    <span id="contadorLicencias" class="badge bg-light text-dark border px-3 py-2 fw-normal">Total: 0</span>
                    <button onclick="cargarSolicitudes()" class="btn btn-outline-primary btn-sm">
                        <i class="fas fa-sync-alt me-1"></i> Actualizar
                    </button>
                    <button onclick="cerrarSesion()" class="btn btn-outline-secondary btn-sm" title="Cerrar sesión">
                        <i class="fas fa-sign-out-alt me-1"></i> Salir
                    </button>
                </div>
            </div>

            <!-- Filtro de Búsqueda -->
            <div class="row mb-4 align-items-center g-3">
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" id="inputFiltroCorreo" class="form-control search-input" placeholder="Filtrar por correo o aplicativo..." onkeyup="filtrarTabla()">
                    </div>
                </div>
                <div class="col-12 col-md-6 col-lg-8">
                    <div class="d-flex flex-wrap justify-content-md-end gap-2" aria-label="Filtrar licencias por estado">
                        <button type="button" class="btn btn-outline-success btn-sm btn-filtro-estado" data-estado="activo" onclick="filtrarPorEstado('activo')" aria-pressed="false">
                            <i class="fas fa-check-circle me-1"></i> Activo
                        </button>
                        <button type="button" class="btn btn-outline-danger btn-sm btn-filtro-estado" data-estado="desactivado" onclick="filtrarPorEstado('desactivado')" aria-pressed="false">
                            <i class="fas fa-ban me-1"></i> Desactivado
                        </button>
                        <button type="button" class="btn btn-outline-warning btn-sm btn-filtro-estado" data-estado="pendiente" onclick="filtrarPorEstado('pendiente')" aria-pressed="false">
                            <i class="fas fa-clock me-1"></i> Pendiente
                        </button>
                    </div>
                </div>
            </div>

            <!-- Tabla de Solicitudes -->
            <div class="table-responsive">
                <table class="table table-hover align-middle table-custom rounded-3 overflow-hidden">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Correo / Aplicativo</th>
                            <th>Estado / Dispositivos</th>
                            <th>Código de Activación</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes">
                        <tr>
                            <td colspan="5" class="text-center text-muted py-5">
                                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                Cargando solicitudes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const urlHttp = "https://turso-puente.acreditacionesmmg.workers.dev/";
        const tursoToken = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODYzOTA3ODQsImlkIjoiMDE5ZmVkMmItOGUwMS03NTBmLWE1OTctMzA5Mzk3NThhZDNiIiwia2lkIjoibGlxd0NQQ1RjVzZLMTJEUWNJMVhVejRCeGZUMWFnT3FDbHZ2Y3RnZ1BqQSIsInJpZCI6IjFjOTgzZGExLWI4MGUtNGE3OS05MjIxLTNhMDc1M2UyYzU0YiJ9.3KWHzJajGz62k_P-mvvBj25I1kwY8ZTJvSUCXUO61sILuwvZTpJoxzdLWr39nZI3DofY2PV_lVGW5BS4QunfAQ";

        let listaGlobalLicencias = [];
        let filtroEstadoActual = '';
        const USUARIO_ADMIN = 'Admin';
        const CLAVE_ADMIN = '12399';
        const TIEMPO_INACTIVIDAD = 15 * 60 * 1000;
        const URL_PANEL = 'https://acreditacionesmmg-debug.github.io/Admin_Licencias/';
        let temporizadorInactividad = null;
        let ultimaActualizacionActividad = 0;

        function sesionEstaActiva() {
            return document.body.classList.contains('sesion-activa');
        }

        function registrarActividad() {
            if (!sesionEstaActiva()) return;

            const ahora = Date.now();
            if (ahora - ultimaActualizacionActividad >= 5000) {
                sessionStorage.setItem('ultimaActividadAdmin', String(ahora));
                ultimaActualizacionActividad = ahora;
            }

            clearTimeout(temporizadorInactividad);
            temporizadorInactividad = setTimeout(() => {
                bloquearSesion('La sesión se cerró por 15 minutos de inactividad.');
            }, TIEMPO_INACTIVIDAD);
        }

        function activarSesion() {
            document.body.classList.add('sesion-activa');
            sessionStorage.setItem('sesionAdminActiva', 'true');
            sessionStorage.setItem('ultimaActividadAdmin', String(Date.now()));
            ultimaActualizacionActividad = Date.now();
            document.getElementById('mensajeAcceso').classList.add('d-none');
            registrarActividad();
            cargarSolicitudes();
        }

        function bloquearSesion(mensaje = '') {
            clearTimeout(temporizadorInactividad);
            document.body.classList.remove('sesion-activa');
            sessionStorage.removeItem('sesionAdminActiva');
            sessionStorage.removeItem('ultimaActividadAdmin');
            listaGlobalLicencias = [];

            const formulario = document.getElementById('formularioAcceso');
            const mensajeAcceso = document.getElementById('mensajeAcceso');
            const campoClave = document.getElementById('claveAcceso');
            const botonVerClave = document.getElementById('botonVerClave');
            formulario.reset();
            campoClave.type = 'password';
            botonVerClave.setAttribute('aria-pressed', 'false');
            botonVerClave.setAttribute('aria-label', 'Mostrar contraseña');
            botonVerClave.title = 'Mostrar contraseña';
            botonVerClave.querySelector('i').className = 'fas fa-eye';
            mensajeAcceso.textContent = mensaje;
            mensajeAcceso.classList.toggle('d-none', !mensaje);
            setTimeout(() => document.getElementById('usuarioAcceso').focus(), 0);
        }

        function cerrarSesion() {
            bloquearSesion('La sesión se cerró correctamente.');
        }

        async function compartirEnlace() {
            const boton = document.getElementById('botonCompartir');

            try {
                if (navigator.share) {
                    await navigator.share({
                        title: 'Panel de Administración de Licencias',
                        text: 'Acceso al panel de administración de licencias:',
                        url: URL_PANEL
                    });
                    return;
                }

                await navigator.clipboard.writeText(URL_PANEL);
                boton.innerHTML = '<i class="fas fa-check me-1"></i> Enlace copiado';
                boton.classList.replace('btn-outline-info', 'btn-success');
                setTimeout(() => {
                    boton.innerHTML = '<i class="fas fa-share-alt me-1"></i> Compartir enlace';
                    boton.classList.replace('btn-success', 'btn-outline-info');
                }, 2200);
            } catch (error) {
                if (error.name === 'AbortError') return;
                prompt('Copia este enlace para compartirlo:', URL_PANEL);
            }
        }

        function alternarVisibilidadClave() {
            const campoClave = document.getElementById('claveAcceso');
            const boton = document.getElementById('botonVerClave');
            const icono = boton.querySelector('i');
            const mostrar = campoClave.type === 'password';

            campoClave.type = mostrar ? 'text' : 'password';
            boton.setAttribute('aria-pressed', String(mostrar));
            boton.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
            boton.title = mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña';
            icono.classList.toggle('fa-eye', !mostrar);
            icono.classList.toggle('fa-eye-slash', mostrar);
            campoClave.focus();
        }

        function iniciarControlDeAcceso() {
            document.getElementById('formularioAcceso').addEventListener('submit', evento => {
                evento.preventDefault();
                const usuario = document.getElementById('usuarioAcceso').value;
                const clave = document.getElementById('claveAcceso').value;

                if (usuario === USUARIO_ADMIN && clave === CLAVE_ADMIN) {
                    activarSesion();
                } else {
                    const mensajeAcceso = document.getElementById('mensajeAcceso');
                    mensajeAcceso.textContent = 'Usuario o contraseña incorrectos.';
                    mensajeAcceso.classList.remove('d-none');
                    document.getElementById('claveAcceso').value = '';
                    document.getElementById('claveAcceso').focus();
                }
            });

            ['mousemove', 'mousedown', 'keydown', 'scroll', 'touchstart'].forEach(nombreEvento => {
                document.addEventListener(nombreEvento, registrarActividad, { passive: true });
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState !== 'visible' || !sesionEstaActiva()) return;
                const ultimaActividad = Number(sessionStorage.getItem('ultimaActividadAdmin') || 0);
                if (!ultimaActividad || Date.now() - ultimaActividad >= TIEMPO_INACTIVIDAD) {
                    bloquearSesion('La sesión se cerró por 15 minutos de inactividad.');
                } else {
                    registrarActividad();
                }
            });

            const sesionGuardada = sessionStorage.getItem('sesionAdminActiva') === 'true';
            const ultimaActividad = Number(sessionStorage.getItem('ultimaActividadAdmin') || 0);
            if (sesionGuardada && ultimaActividad && Date.now() - ultimaActividad < TIEMPO_INACTIVIDAD) {
                activarSesion();
            } else {
                bloquearSesion();
            }
        }

        function generarCodigoAleatorio(id) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let codigo = "MMG";
            for (let i = 0; i < 3; i++) {
                codigo += "-" + Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            }
            const input = document.getElementById(`codigo-${id}`);
            if (input) input.value = codigo;
        }

        function copiarCodigo(id) {
            const input = document.getElementById(`codigo-${id}`);
            if (!input || !input.value.trim()) {
                alert("No hay ningún código para copiar.");
                return;
            }
            navigator.clipboard.writeText(input.value.trim()).then(() => {
                alert(`¡Código copiado al portapapeles: ${input.value.trim()}! Ya puedes enviarlo a tu cliente.`);
            }).catch(err => {
                console.error("Error al copiar: ", err);
                alert("No se pudo copiar el código.");
            });
        }

        async function cargarSolicitudes() {
            const tbody = document.getElementById('tablaSolicitudes');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary me-2"></div>Cargando...</td></tr>';

            const bodyData = {
                requests: [
                    {
                        type: "execute",
                        stmt: { sql: "SELECT id, email, nombre_aplicativo, codigo_activacion, estado, dispositivos_conectados FROM licencias ORDER BY id DESC;" }
                    },
                    { type: "close" }
                ]
            };

            try {
                const response = await fetch(urlHttp, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${tursoToken}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!response.ok) throw new Error("Error en la respuesta del servidor");

                const data = await response.json();
                const resultSet = data.results[0].response.result;
                const rows = resultSet.rows;

                if (!rows || rows.length === 0) {
                    listaGlobalLicencias = [];
                    renderizarTabla([]);
                    document.getElementById('contadorLicencias').innerText = 'Total: 0';
                    return;
                }

                listaGlobalLicencias = rows.map(row => ({
                    id: row[0].value,
                    email: row[1].value,
                    aplicativo: row[2] && row[2].value ? row[2].value : 'General',
                    codigo: row[3] && row[3].value !== null ? row[3].value : '',
                    estado: row[4] && row[4].value ? row[4].value : 'pendiente',
                    dispositivos: row[5] ? row[5].value : 0
                }));

                document.getElementById('contadorLicencias').innerText = `Total: ${listaGlobalLicencias.length}`;
                filtrarTabla();

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-5"><i class="fas fa-exclamation-triangle me-1"></i> Error al conectar con la base de datos.</td></tr>';
            }
        }

        function filtrarTabla() {
            const filtro = document.getElementById('inputFiltroCorreo').value.toLowerCase();
            const filtrados = listaGlobalLicencias.filter(item => {
                const coincideTexto = item.email.toLowerCase().includes(filtro) ||
                    item.aplicativo.toLowerCase().includes(filtro);
                const estado = item.estado ? item.estado.toLowerCase() : 'pendiente';
                const coincideEstado = !filtroEstadoActual || estado === filtroEstadoActual;
                return coincideTexto && coincideEstado;
            });
            renderizarTabla(filtrados);
        }

        function filtrarPorEstado(estado) {
            filtroEstadoActual = filtroEstadoActual === estado ? '' : estado;

            document.querySelectorAll('.btn-filtro-estado').forEach(boton => {
                const seleccionado = boton.dataset.estado === filtroEstadoActual;
                boton.setAttribute('aria-pressed', String(seleccionado));
                boton.classList.toggle('active', seleccionado);
            });

            filtrarTabla();
        }

        function renderizarTabla(datos) {
            const tbody = document.getElementById('tablaSolicitudes');
            if (!datos || datos.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-5">No se encontraron registros coincidentes.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            datos.forEach(item => {
                const estadoLower = item.estado ? item.estado.toLowerCase() : 'pendiente';
                let badgeClass = 'badge-pending';
                let textoEstado = 'pendiente';

                if (estadoLower === 'activo') {
                    badgeClass = 'badge-active';
                    textoEstado = 'activo';
                } else if (estadoLower === 'desactivado') {
                    badgeClass = 'badge-disabled';
                    textoEstado = 'desactivado';
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="ID"><strong>#${item.id}</strong></td>
                    <td data-label="Correo / Aplicativo">
                        <div>
                            <div class="fw-semibold text-break">${item.email}</div>
                            <span class="badge app-badge mt-1">${item.aplicativo}</span>
                        </div>
                    </td>
                    <td data-label="Estado / Dispositivos">
                        <div>
                            <span class="badge ${badgeClass} text-uppercase">${textoEstado}</span>
                            <div class="small text-muted mt-1"><i class="fas fa-laptop me-1"></i>Dispositivos: ${item.dispositivos}</div>
                        </div>
                    </td>
                    <td data-label="Código de Activación">
                        <div class="input-group input-group-sm mb-1" style="min-width: 220px;">
                            <input type="text" id="codigo-${item.id}" class="form-control" value="${item.codigo}" placeholder="Generar código...">
                            <button class="btn btn-outline-secondary" type="button" onclick="generarCodigoAleatorio(${item.id})" title="Generar código aleatorio">
                                <i class="fas fa-magic"></i>
                            </button>
                            <button class="btn btn-outline-info" type="button" onclick="copiarCodigo(${item.id})" title="Copiar código">
                                <i class="fas fa-copy"></i>
                            </button>
                        </div>
                    </td>
                    <td data-label="Acciones" class="text-center">
                        <div class="d-flex justify-content-center gap-1 flex-wrap">
                            <button onclick="aprobarLicencia(${item.id})" class="btn btn-success btn-action text-nowrap" title="Aprobar licencia">
                                <i class="fas fa-check me-1"></i> Aprobar
                            </button>
                            <button onclick="quitarLicencia(${item.id})" class="btn btn-outline-danger btn-action text-nowrap" title="Quitar licencia">
                                <i class="fas fa-undo me-1"></i> Quitar
                            </button>
                            <button onclick="eliminarLicencia(${item.id})" class="btn btn-danger btn-action text-nowrap" title="Eliminar licencia definitivamente">
                                <i class="fas fa-trash-alt me-1"></i> Eliminar
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function aprobarLicencia(id) {
            const inputCodigo = document.getElementById(`codigo-${id}`);
            const nuevoCodigo = inputCodigo ? inputCodigo.value.trim() : '';

            if (!nuevoCodigo) {
                alert("Por favor genera o escribe un código de activación antes de aprobar.");
                return;
            }

            const bodyData = {
                requests: [
                    {
                        type: "execute",
                        stmt: {
                            sql: "UPDATE licencias SET codigo_activacion = ?, estado = 'activo' WHERE id = ?;",
                            args: [
                                { type: "text", value: nuevoCodigo },
                                { type: "text", value: String(id) }
                            ]
                        }
                    },
                    { type: "close" }
                ]
            };

            try {
                const response = await fetch(urlHttp, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${tursoToken}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify(bodyData)
                });

                const resultJson = await response.json();

                if (response.ok && !resultJson.results[0].response.error) {
                    alert(`¡Licencia #${id} aprobada y código guardado con éxito!`);
                    cargarSolicitudes();
                } else {
                    console.error("Error devuelto por Turso:", resultJson);
                    alert("Hubo un error al actualizar la base de datos.");
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión al guardar cambios.");
            }
        }

        async function quitarLicencia(id) {
            if (!confirm(`¿Estás seguro de quitar la licencia #${id}? Se pondrán sus dispositivos en 0 y su estado cambiará a desactivado.`)) {
                return;
            }

            const bodyData = {
                requests: [
                    {
                        type: "execute",
                        stmt: {
                            sql: "UPDATE licencias SET estado = 'desactivado', dispositivos_conectados = 0 WHERE id = ?;",
                            args: [
                                { type: "text", value: String(id) }
                            ]
                        }
                    },
                    { type: "close" }
                ]
            };

            try {
                const response = await fetch(urlHttp, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${tursoToken}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify(bodyData)
                });

                const resultJson = await response.json();

                if (response.ok && !resultJson.results[0].response.error) {
                    alert(`Se ha quitado la licencia #${id} exitosamente.`);
                    cargarSolicitudes();
                } else {
                    console.error("Error devuelto por Turso:", resultJson);
                    alert("Hubo un error al quitar la licencia.");
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión al actualizar la licencia.");
            }
        }

        async function eliminarLicencia(id) {
            if (!confirm(`¿Estás seguro de eliminar definitivamente la licencia #${id}? Esta acción no se puede deshacer.`)) {
                return;
            }

            const bodyData = {
                requests: [
                    {
                        type: "execute",
                        stmt: {
                            sql: "DELETE FROM licencias WHERE id = ?;",
                            args: [
                                { type: "text", value: String(id) }
                            ]
                        }
                    },
                    { type: "close" }
                ]
            };

            try {
                const response = await fetch(urlHttp, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${tursoToken}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(bodyData)
                });

                const resultJson = await response.json();

                if (response.ok && !resultJson.results[0].response.error) {
                    alert(`La licencia #${id} fue eliminada definitivamente.`);
                    cargarSolicitudes();
                } else {
                    console.error("Error devuelto por Turso:", resultJson);
                    alert("Hubo un error al eliminar la licencia de la base de datos.");
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión al eliminar la licencia.");
            }
        }

        window.onload = iniciarControlDeAcceso;
    </script>
</body>
</html>
