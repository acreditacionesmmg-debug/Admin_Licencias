<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Gestión de Licencias</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-container { max-width: 1200px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        @media (min-width: 768px) { .admin-container { padding: 30px; margin: 40px auto; } }
    </style>
</head>
<body>

    <div class="container-fluid px-2 px-md-4">
        <div class="admin-container">
            <!-- Cabecera -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-3 border-bottom gap-3">
                <div>
                    <h2><i class="fas fa-user-shield text-primary me-2"></i>Panel de Administración</h2>
                    <p class="text-muted small mb-0">Gestión de licencias y códigos de acceso</p>
                </div>
                <button onclick="cargarSolicitudes()" class="btn btn-outline-secondary btn-sm align-self-start align-self-md-auto">
                    <i class="fas fa-sync-alt me-1"></i> Actualizar Lista
                </button>
            </div>

            <!-- Tabla de Solicitudes -->
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Correo / Aplicativo</th>
                            <th>Estado / Dispositivos</th>
                            <th>Código de Activación</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaSolicitudes">
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">Cargando solicitudes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const urlHttp = "https://turso-puente.acreditacionesmmg.workers.dev/";
        const tursoToken = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODYzOTA3ODQsImlkIjoiMDE5ZmVkMmItOGUwMS03NTBmLWE1OTctMzA5Mzk3NThhZDNiIiwia2lkIjoibGlxd0NQQ1RjVzZLMTJEUWNJMVhVejRCeGZUMWFnT3FDbHZ2Y3RnZ1BqQSIsInJpZCI6IjFjOTgzZGExLWI4MGUtNGE3OS05MjIxLTNhMDc1M2UyYzU0YiJ9.3KWHzJajGz62k_P-mvvBj25I1kwY8ZTJvSUCXUO61sILuwvZTpJoxzdLWr39nZI3DofY2PV_lVGW5BS4QunfAQ";

        // Función para generar código aleatorio único con la varita mágica
        function generarCodigoAleatorio(id) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let codigo = "MMG";
            for (let i = 0; i < 3; i++) {
                codigo += "-" + Array.from({length: 4}, () => chars[Math.floor(Math.random() * chars.length)]).join('');
            }
            document.getElementById(`codigo-${id}`).value = codigo;
        }

        async function cargarSolicitudes() {
            const tbody = document.getElementById('tablaSolicitudes');
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Cargando...</td></tr>';

            const bodyData = {
                requests: [
                    {
                        type: "execute",
                        stmt: { sql: "SELECT id, email, nombre_aplicativo, codigo_activacion, estado, dispositivos_conectados FROM licencias ORDER BY id DESC;" }
                    },
                    { type: "close" }
                ]
            };

            try {
                const response = await fetch(urlHttp, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${tursoToken}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!response.ok) throw new Error("Error en la respuesta del servidor");

                const data = await response.json();
                const resultSet = data.results[0].response.result;
                const rows = resultSet.rows;

                if (!rows || rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No hay solicitudes registradas.</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                rows.forEach(row => {
                    const id = row[0].value;
                    const email = row[1].value;
                    const aplicativo = row[2].value;
                    const codigo = row[3] && row[3].value !== null ? row[3].value : '';
                    const estado = row[4].value;
                    const dispositivos = row[5] ? row[5].value : 0;

                    let badgeColor = estado === 'activo' ? 'bg-success' : 'bg-warning text-dark';

                    let tr = `
                        <tr>
                            <td><strong>#${id}</strong></td>
                            <td>
                                <div class="fw-semibold text-break">${email}</div>
                                <span class="badge bg-info text-dark mt-1">${aplicativo}</span>
                            </td>
                            <td>
                                <span class="badge ${badgeColor}">${estado}</span>
                                <div class="small text-muted mt-1"><i class="fas fa-laptop"></i> Dispositivos: ${dispositivos}</div>
                            </td>
                            <td>
                                <div class="input-group input-group-sm mb-1" style="min-width: 220px;">
                                    <input type="text" id="codigo-${id}" class="form-control" value="${codigo}" placeholder="Generar código...">
                                    <button class="btn btn-outline-primary" type="button" onclick="generarCodigoAleatorio(${id})" title="Generar código aleatorio">
                                        <i class="fas fa-magic"></i>
                                    </button>
                                </div>
                            </td>
                            <td class="text-center">
                                <button onclick="aprobarLicencia(${id})" class="btn btn-success btn-sm w-100 text-nowrap">
                                    <i class="fas fa-check me-1"></i> Aprobar y Guardar
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += tr;
                });

            } catch (error) {
                console.error(error);
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-4">Error al conectar. Revisa la consola (F12).</td></tr>';
            }
        }

        async function aprobarLicencia(id) {
            const inputCodigo = document.getElementById(`codigo-${id}`);
            const nuevoCodigo = inputCodigo.value.trim();

            if (!nuevoCodigo) {
                alert("Por favor genera o escribe un código de activación antes de aprobar.");
                return;
            }

            const bodyData = {
                requests: [
                    {
                        type: "execute",
                        stmt: {
                            sql: "UPDATE licencias SET codigo_activacion = ?, estado = 'activo' WHERE id = ?;",
                            args: [
                                { type: "text", value: nuevoCodigo },
                                { type: "integer", value: id }
                            ]
                        }
                    },
                    { type: "close" }
                ]
            };

            try {
                const response = await fetch(urlHttp, {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${tursoToken}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify(bodyData)
                });

                if (response.ok) {
                    alert(`¡Licencia #${id} aprobada y código guardado con éxito!`);
                    cargarSolicitudes();
                } else {
                    alert("Hubo un error al actualizar la base de datos.");
                }
            } catch (error) {
                console.error(error);
                alert("Error de conexión al guardar cambios.");
            }
        }

        window.onload = cargarSolicitudes;
    </script>
</body>
</html>
